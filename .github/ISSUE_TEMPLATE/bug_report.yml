name: Bug report
description: Report a reproducible application defect.
body:
  - type: markdown
    attributes:
      value: "Do not include personal backups, private notes or credentials. Report security vulnerabilities through private vulnerability reporting."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0-beta.8
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, version and architecture
      description: Include Apple silicon/Intel for Mac; distribution, desktop and X11/Wayland for Linux.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the edition and passage reference if relevant. Use synthetic personal notes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
